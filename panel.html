<!DOCTYPE html>
<html lang="tr">
<head>

<body class="panel-page">

<header class="topbar">

    <a href="/panel" class="topbar-brand">
      <span class="topbar-brand-mark">

        <span class="topbar-brand-sep"></span>

      </span>

    <div class="topbar-user">
      <div class="user-profile-dropdown">
        <button class="profile-trigger" type="button" id="userMenuBtn" aria-expanded="false">
          <span class="topbar-avatar">E</span>
          <span class="topbar-user-name">Ercüment</span>
          <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>

        <div class="profile-dropdown-menu" id="userMenuDropdown">
          <a href="/profil" class="dropdown-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

          <a href="/kvkk" class="dropdown-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>

          </a>
          <a href="/sifre-degistir" class="dropdown-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

          </a>

      </div>
    </div>

  </div>

<main class="container">
  <div class="page-head">
    <h1 id="panelBaslik">Panel</h1>
    <p class="muted" id="panelAlt">—</p>

  <div id="panelIcerik"></div>
